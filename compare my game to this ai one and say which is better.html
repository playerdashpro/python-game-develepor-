<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Minimal 2D Platformer</title>
	<style>
		html,body{height:100%;margin:0;background:#87CEEB;position:relative;}
		canvas{display:block;margin:0 auto;background:linear-gradient(#87CEEB,#6EB2E7);box-shadow:0 8px 30px rgba(0,0,0,0.2);position:relative;z-index:1}
		#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);z-index:2}
		#menu .panel{background:rgba(255,255,255,0.96);padding:28px 32px;border-radius:18px;box-shadow:0 20px 40px rgba(0,0,0,0.2);text-align:center;max-width:360px;}
		#menu button{margin:8px 6px;padding:10px 18px;font-size:16px;border:none;border-radius:10px;cursor:pointer;background:#4caf50;color:#fff;}
		#menu button:hover{background:#43a047;}
		#menu h1{margin:0 0 12px;font-size:24px;}
		#menu p{margin:12px 0 0;font-size:14px;color:#333;}
	</style>
</head>
<body>
<div id="menu">
	<div class="panel">
		<h1>Minimal 2D Platformer</h1>
		<button id="playBtn">Play</button>
		<button id="buildBtn">Level Editor</button>
		<p>Use the menu to start the game or build your own level.</p>
		<p>In the editor: left click add platform, right click place goal.</p>
	</div>
</div>
<canvas id="game" width="900" height="600"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');
const playBtn = document.getElementById('playBtn');
const buildBtn = document.getElementById('buildBtn');
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

let mode = 'menu';
const editorPlatforms = [];
let editorGoal = null;
let customLevel = null;

const gravity = 1200; // px/s^2

const player = {
	x:50, y:400, w:36, h:48,
	vx:0, vy:0,
	speed:260, jump:520,
	onGround:false,
	wallLeft:false,
	wallRight:false,
	color:'#ffdd57'
};

const levels = [
	{
		platforms: [
			{x:0,y:560,w:900,h:40},
			{x:150,y:460,w:160,h:20},
			{x:380,y:380,w:140,h:20},
			{x:560,y:300,w:200,h:20},
			{x:780,y:220,w:80,h:20},
			{x:300,y:520,w:120,h:20}
		],
		goal: {x:820,y:180,w:40,h:40}
	},
	{
		platforms: [
			{x:0,y:560,w:900,h:40},
			{x:80,y:440,w:120,h:20},
			{x:240,y:360,w:120,h:20},
			{x:420,y:300,w:80,h:20},
			{x:540,y:420,w:140,h:20},
			{x:700,y:260,w:160,h:20}
		],
		goal: {x:760,y:220,w:40,h:40}
	},
	{
		platforms: [
			{x:0,y:560,w:900,h:40},
			{x:200,y:480,w:80,h:20},
			{x:320,y:420,w:80,h:20},
			{x:440,y:360,w:80,h:20},
			{x:560,y:300,w:80,h:20},
			{x:680,y:240,w:80,h:20}
		],
		goal: {x:700,y:200,w:40,h:40}
	},
	{
		platforms: [
			{x:0,y:560,w:900,h:40},
			{x:140,y:500,w:100,h:20},
			{x:300,y:430,w:120,h:20},
			{x:500,y:360,w:120,h:20},
			{x:660,y:290,w:80,h:20}
		],
		goal: {x:700,y:250,w:40,h:40}
	},
	{
		platforms: [
			{x:0,y:560,w:900,h:40},
			{x:180,y:520,w:80,h:20},
			{x:340,y:440,w:80,h:20},
			{x:500,y:360,w:80,h:20},
			{x:640,y:280,w:80,h:20},
			{x:760,y:220,w:80,h:20}
		],
		goal: {x:780,y:180,w:40,h:40}
	}
];

const totalLevels = 50;
for(let i = levels.length; i < totalLevels; i++){
	const step = i - 4;
	const x1 = 80 + (step * 18) % 320;
	const x2 = 240 + (step * 22) % 240;
	const x3 = 420 + (step * 14) % 180;
	const x4 = 620 + (step * 16) % 180;
	const y1 = Math.max(220, 460 - step * 4);
	const y2 = Math.max(160, 380 - step * 4);
	const y3 = Math.max(120, 320 - step * 4);
	const y4 = Math.max(80, 260 - step * 4);
	const goalY = Math.max(80, 180 - step * 3);
	levels.push({
		platforms: [
			{x:0,y:560,w:900,h:40},
			{x:x1,y:y1,w:120,h:20},
			{x:x2,y:y2,w:120,h:20},
			{x:x3,y:y3,w:120,h:20},
			{x:x4,y:y4,w:120,h:20}
		],
		goal: {x:760 + (step * 10) % 120, y: goalY, w:40, h:40}
	});
}

let currentLevel = 0;
let platforms = levels[currentLevel].platforms;
let goal = levels[currentLevel].goal;

let last = performance.now();

function rectsIntersect(a,b){
	return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function resetPlayer(){
	player.x = 50;
	player.y = 300;
	player.vx = player.vy = 0;
	player.onGround = false;
	player.wallLeft = false;
	player.wallRight = false;
}

function loadLevel(index){
	currentLevel = index % levels.length;
	platforms = levels[currentLevel].platforms;
	goal = levels[currentLevel].goal;
	resetPlayer();
}

function loadCustomLevel(){
	platforms = customLevel.platforms;
	goal = customLevel.goal;
	resetPlayer();
}

function showMenu(){
	menu.style.display = 'flex';
	mode = 'menu';
}

function startPlay(useCustom = false){
	menu.style.display = 'none';
	if(useCustom && editorGoal){
		customLevel = {platforms: editorPlatforms.map(p => ({...p})), goal: {...editorGoal}};
		loadCustomLevel();
	} else {
		customLevel = null;
		loadLevel(0);
	}
	mode = 'play';
	last = performance.now();
}

function startEditor(){
	menu.style.display = 'none';
	mode = 'editor';
	editorPlatforms.length = 0;
	editorGoal = null;
	customLevel = null;
	last = performance.now();
}

playBtn.addEventListener('click', () => startPlay());
buildBtn.addEventListener('click', () => startEditor());

window.addEventListener('keydown', e => {
	if(mode === 'editor'){
		if(e.code === 'KeyR'){
			editorPlatforms.length = 0;
			editorGoal = null;
		}
		if(e.code === 'Enter' && editorGoal){
			startPlay(true);
		}
	}
	if(e.code === 'Escape'){
		showMenu();
	}
});

canvas.addEventListener('mousedown', e => {
	if(mode !== 'editor') return;
	const rect = canvas.getBoundingClientRect();
	const x = e.clientX - rect.left;
	const y = e.clientY - rect.top;
	if(e.button === 0){
		editorPlatforms.push({x: Math.floor(x / 20) * 20, y: Math.floor(y / 20) * 20, w: 120, h: 20});
	}
	if(e.button === 2){
		editorGoal = {x: Math.max(0, Math.min(canvas.width - 40, Math.floor(x / 20) * 20)), y: Math.max(0, Math.min(canvas.height - 40, Math.floor(y / 20) * 20)), w: 40, h: 40};
	}
});
canvas.addEventListener('contextmenu', e => {
	if(mode === 'editor') e.preventDefault();
});

function step(dt){
	if(mode !== 'play') return;
	let targetVx = 0;
	if(keys['ArrowLeft'] || keys['KeyA']) targetVx = -player.speed;
	if(keys['ArrowRight']|| keys['KeyD']) targetVx = player.speed;
	const accel = 2000;
	player.vx += (targetVx - player.vx) * Math.min(1, accel*dt/Math.abs(targetVx - player.vx || 1));

	player.vy += gravity * dt;

	if((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && (player.onGround || player.wallLeft || player.wallRight)){
		player.vy = -player.jump;
		player.onGround = false;
		if(player.wallLeft) player.vx = player.speed;
		if(player.wallRight) player.vx = -player.speed;
	}

	player.x += player.vx * dt;
	player.y += player.vy * dt;

	player.onGround = false;
	player.wallLeft = false;
	player.wallRight = false;
	const bbox = {x:player.x,y:player.y,w:player.w,h:player.h};
	for(const p of platforms){
		if(rectsIntersect(bbox,p)){
			const overlapX = Math.min(bbox.x+bbox.w - p.x, p.x+p.w - bbox.x);
			const overlapY = Math.min(bbox.y+bbox.h - p.y, p.y+p.h - bbox.y);
			if(overlapY < overlapX){
				if(bbox.y < p.y){ player.y = p.y - player.h; player.vy = 0; player.onGround = true; }
				else { player.y = p.y + p.h; player.vy = 0; }
			} else {
				if(bbox.x < p.x){ player.x = p.x - player.w; player.vx = 0; player.wallRight = true; }
				else { player.x = p.x + p.w; player.vx = 0; player.wallLeft = true; }
			}
		}
	}

	if(player.x < 0) player.x = 0;
	if(player.x + player.w > canvas.width) player.x = canvas.width - player.w;
	if(player.y > canvas.height){
		if(customLevel) loadCustomLevel();
		else loadLevel(currentLevel);
	}
}

function draw(){
	ctx.clearRect(0,0,canvas.width,canvas.height);
	const g = ctx.createLinearGradient(0,0,0,canvas.height);
	g.addColorStop(0,'#9fd8ff'); g.addColorStop(1,'#6EB2E7');
	ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);

	if(mode === 'editor'){
		for(let x = 0; x < canvas.width; x += 20){
			ctx.strokeStyle = 'rgba(255,255,255,0.12)';
			ctx.beginPath();
			ctx.moveTo(x,0); ctx.lineTo(x,canvas.height);
			ctx.stroke();
		}
		for(let y = 0; y < canvas.height; y += 20){
			ctx.strokeStyle = 'rgba(255,255,255,0.12)';
			ctx.beginPath();
			ctx.moveTo(0,y); ctx.lineTo(canvas.width,y);
			ctx.stroke();
		}
		for(const p of editorPlatforms){
			ctx.fillStyle = '#6b4f3b'; ctx.fillRect(p.x,p.y,p.w,p.h);
			ctx.strokeStyle = '#4b2f1f'; ctx.strokeRect(p.x,p.y,p.w,p.h);
		}
		if(editorGoal){
			ctx.fillStyle = '#4caf50';
			ctx.fillRect(editorGoal.x,editorGoal.y,editorGoal.w,editorGoal.h);
			ctx.strokeStyle = '#1b5e20';
			ctx.strokeRect(editorGoal.x,editorGoal.y,editorGoal.w,editorGoal.h);
		}
		ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.font='16px sans-serif';
		ctx.fillText('Editor mode: left click add platform, right click place goal.', 12, 24);
		ctx.fillText('Press Enter to play custom level, R to reset, Esc for menu.', 12, 46);
		return;
	}

	for(const p of platforms){
		ctx.fillStyle = '#6b4f3b'; ctx.fillRect(p.x,p.y,p.w,p.h);
		ctx.strokeStyle = '#4b2f1f'; ctx.strokeRect(p.x,p.y,p.w,p.h);
	}

	ctx.fillStyle = '#4caf50';
	ctx.fillRect(goal.x,goal.y,goal.w,goal.h);
	ctx.strokeStyle = '#1b5e20';
	ctx.strokeRect(goal.x,goal.y,goal.w,goal.h);

	ctx.fillStyle = player.color;
	ctx.fillRect(player.x,player.y,player.w,player.h);
	ctx.strokeStyle = '#000'; ctx.strokeRect(player.x,player.y,player.w,player.h);
	ctx.fillStyle = '#000';
	ctx.fillRect(player.x+8, player.y+14, 6, 6);
	ctx.fillRect(player.x+22, player.y+14, 6, 6);
	ctx.beginPath();
	ctx.arc(player.x+18, player.y+32, 8, 0, Math.PI);
	ctx.stroke();

	ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.font='16px sans-serif';
	ctx.fillText('Arrows/A-D to move, Space to jump / wallhop', 12, 24);
	ctx.fillText('Level ' + (customLevel ? 'Custom' : (currentLevel + 1)) + ' / ' + levels.length, 12, 46);
}

function loop(t){
	const dt = Math.min(0.033, (t-last)/1000);
	step(dt);
	if(mode === 'play' && rectsIntersect({x:player.x,y:player.y,w:player.w,h:player.h}, goal)){
		if(customLevel) loadCustomLevel();
		else loadLevel(currentLevel + 1);
	}
	draw();
	last = t;
	requestAnimationFrame(loop);
}

loadLevel(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
